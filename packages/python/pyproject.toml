[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "autouncle-avs"
version = "0.3.0"
description = "AVS – AutoUncle Vehicle Schema: the JSON Schema, typed dicts and a validator"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = ["jsonschema[format-nongpl]>=4.18", "typing_extensions>=4.7"]
classifiers = ["Typing :: Typed"]

[project.urls]
Source = "https://github.com/AutoUncle/avs/tree/main/packages/python"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/avs"]
