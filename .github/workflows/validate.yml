name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install check-jsonschema==0.29.4
      - name: Schema is valid JSON Schema
        run: check-jsonschema --check-metaschema schema/avs.schema.json
      - name: Examples validate against the schema
        run: check-jsonschema --schemafile schema/avs.schema.json examples/*.json
      - name: Invalid documents are rejected
        run: scripts/check-invalid.sh

  packages-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5
      - run: npm ci
        working-directory: packages/npm
      - run: scripts/sync
      - name: Packages match schema/ and VERSION (run scripts/sync if this fails)
        run: git diff --exit-code

  ruby:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ["3.2", "3.4"]
    defaults:
      run:
        working-directory: packages/ruby
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: packages/ruby
      - run: bundle exec rake test

  npm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --python ${{ matrix.python }} --group dev pytest -q

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/go/go.mod
          cache-dependency-path: packages/go/go.sum
      - run: go vet ./...
      - run: go test ./...

  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B test

  dotnet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test tests/AutoUncle.Avs.Tests
      - run: dotnet pack src/AutoUncle.Avs -c Release

  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.1", "8.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
      - run: composer install --no-progress
      - run: composer test
