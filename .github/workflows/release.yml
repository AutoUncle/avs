name: Release

# Push a tag vX.Y.Z matching /VERSION. This publishes:
#   Ruby gem, npm package, Maven artifact, NuGet package → GitHub Packages
#   Python wheel + sdist → attached to the GitHub Release (GitHub Packages has no PyPI registry)
#   Go → tag packages/go/vX.Y.Z (Go's convention for a module in a subdirectory)
#   PHP → nothing extra; Composer reads the vX.Y.Z tag
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches VERSION
        run: test "v$(tr -d '[:space:]' < VERSION)" = "$GITHUB_REF_NAME"

  ruby:
    needs: check-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: packages/ruby
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: packages/ruby
      - run: bundle exec rake test
      - run: gem build autouncle-avs.gemspec
      - env:
          GEM_HOST_API_KEY: "Bearer ${{ secrets.GITHUB_TOKEN }}"
        run: gem push --host https://rubygems.pkg.github.com/${{ github.repository_owner }} autouncle-avs-*.gem

  npm:
    needs: check-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: packages/npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@autouncle"
      - run: npm ci
      - run: npm test
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  java:
    needs: check-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: packages/java
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: github
      - run: mvn -B deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dotnet:
    needs: check-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: packages/dotnet
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test tests/AutoUncle.Avs.Tests
      - run: dotnet pack src/AutoUncle.Avs -c Release -o out
      - run: dotnet nuget push "out/*.nupkg" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key "${{ secrets.GITHUB_TOKEN }}"

  python:
    needs: check-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run --group dev pytest -q
      - run: uv build
      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md."
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  go:
    needs: check-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag the Go module
        run: |
          git tag "packages/go/$GITHUB_REF_NAME" "$GITHUB_SHA"
          git push origin "packages/go/$GITHUB_REF_NAME"
