version: 2

# Weekly, one grouped PR per ecosystem so updates stay reviewable.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }

  - package-ecosystem: bundler
    directory: /packages/ruby
    schedule: { interval: weekly }
    groups: { ruby: { patterns: ["*"] } }

  - package-ecosystem: npm
    directory: /packages/npm
    schedule: { interval: weekly }
    groups: { npm: { patterns: ["*"] } }

  - package-ecosystem: pip
    directory: /packages/python
    schedule: { interval: weekly }
    groups: { python: { patterns: ["*"] } }

  - package-ecosystem: gomod
    directory: /packages/go
    schedule: { interval: weekly }
    groups: { go: { patterns: ["*"] } }

  - package-ecosystem: maven
    directory: /packages/java
    schedule: { interval: weekly }
    groups: { java: { patterns: ["*"] } }

  - package-ecosystem: nuget
    directory: /packages/dotnet
    schedule: { interval: weekly }
    groups: { dotnet: { patterns: ["*"] } }

  - package-ecosystem: composer
    directory: /
    schedule: { interval: weekly }
    groups: { php: { patterns: ["*"] } }
